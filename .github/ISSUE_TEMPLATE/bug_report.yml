name: Bug report
description: Something in a Pollen package does not work the way the docs say.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the
        details below — reproduction steps are the difference between a
        same-day fix and a stalled issue.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - pollen-ui (web components)
        - "@pollen/tokens"
        - "@pollen/native"
        - Documentation site
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The exact package version, e.g. 5.0.0.
      placeholder: 5.0.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Next.js App Router
        - Next.js Pages Router
        - Vite / other SPA
        - React Native (Expo)
        - Docs site itself
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code plus the exact steps. Include imports.
      placeholder: |
        1. Render <Button variant="ghost">…
        2. Click it
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happens vs. what did you expect?
      description: A screenshot or short recording helps a lot.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Browser/OS, dark mode on/off, reduced motion on, Tailwind config if relevant.
