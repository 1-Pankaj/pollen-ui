name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        default: pollen-ui
        options:
          - pollen-ui
          - "@pollen/tokens"
          - "@pollen/native"

jobs:
  publish:
    name: Publish ${{ github.event.inputs.package }}
    runs-on: ubuntu-latest
    # Manual dispatch only; a maintainer decides when a release goes out.
    environment: npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify NPM_TOKEN is configured
        # Fail here, in seconds, with the fix — instead of after the full
        # install and build, as a bare npm ENEEDAUTH.
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::The NPM_TOKEN secret is not set, so npm publish cannot authenticate. Fix: repository Settings → Secrets and variables → Actions → New repository secret. Name: NPM_TOKEN. Value: an npm access token with publish rights (npmjs.com → profile picture → Access Tokens → Generate New Token → Classic, type Automation, or a Granular token with Read and write on Packages). Then re-run this workflow."
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build --workspace @pollen/tokens
          npm run build:lib

      - name: Publish to npm
        working-directory: ${{ github.event.inputs.package == 'pollen-ui' && 'packages/pollen-ui' || github.event.inputs.package == '@pollen/tokens' && 'packages/tokens' || 'packages/native' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_DIR: ${{ github.event.inputs.package == 'pollen-ui' && 'packages/pollen-ui' || github.event.inputs.package == '@pollen/tokens' && 'packages/tokens' || 'packages/native' }}
        run: |
          VERSION=$(node -p "require('./${PKG_DIR}/package.json').version")
          TAG="v${VERSION}"
          git tag "$TAG" 2>/dev/null || echo "tag $TAG already exists"
          git push origin "$TAG" || true
