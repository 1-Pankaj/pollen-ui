name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Approve esbuild install script
        run: npm install-scripts approve esbuild || true

      - name: Typecheck (site + library + native)
        run: |
          npm run typecheck
          npm run typecheck:lib
          npm run typecheck --workspace @pollen-ui/native

      - name: Lint
        run: npm run lint

      - name: Token agreement check
        run: npm run check:tokens

      - name: Build library
        run: npm run build:lib

      - name: Build documentation site
        run: npm run build
