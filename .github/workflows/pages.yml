name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Approve esbuild install script
        run: npm install-scripts approve esbuild || true

      - name: Check GitHub Pages is enabled
        # One-time setup that only a repository admin can do from the UI:
        # Settings → Pages → Build and deployment → Source → "GitHub Actions".
        # The workflow token cannot create the site itself (the create-site
        # API requires administration access the Actions token never has),
        # so a missing site would otherwise fail deep inside deploy with a
        # bare "Resource not accessible by integration".
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages")
          if [ "$STATUS" = "404" ]; then
            echo "::error::GitHub Pages is not enabled for this repository yet. Open Settings → Pages → Build and deployment → Source and select “GitHub Actions”, then re-run this workflow. That is a one-time, admin-only setting; everything after it is automated."
            exit 1
          fi

      - name: Compute base path
        run: |
          # Project pages are served from /<repo-name>. A user or
          # organization page repo (<name>.github.io) is served from
          # the root instead.
          if [[ "${GITHUB_REPOSITORY##*/}" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"
          fi

      - name: Build static site
        run: npm run build
        env:
          NEXT_OUTPUT: export

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
